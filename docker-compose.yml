version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finance_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finance_test
    ports: 
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7-alpine
    ports: 
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports: 
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/finance_db
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: production
      ACCESS_TOKEN_SECRET: sdjkfnirueu8t85eu98344uewsndZzckanfni3qotu875tbdjdfszksdcnwe4wuifsijf
      REFRESH_TOKEN_SECRET: dsfnwuiuryw837qy3y23r9qwryfhsuyfbsenfvzub3wy4rf847arhfnhcsdrbjt348
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: